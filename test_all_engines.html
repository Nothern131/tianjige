<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0806;color:#e0dcd0;font-family:'Microsoft YaHei',sans-serif;display:flex;min-height:100vh}

  .card .card-bd .stat{display:inline-block;background:rgba(184,154,92,0.1);color:#b89a5c;padding:2px 9px;border-radius:5px;font-size:0.72rem;margin-right:5px;margin-bottom:6px}

  .btn{background:rgba(184,154,92,0.12);border:1px solid rgba(184,154,92,0.25);color:#b89a5c;padding:6px 16px;border-radius:7px;cursor:pointer;font-size:0.82rem;font-family:inherit;transition:all 0.2s}
  .btn:hover{background:rgba(184,154,92,0.22)}

  /* 追问区域 */
  .followup-box{border:1px solid rgba(184,154,92,0.2);border-radius:12px;padding:16px;margin-bottom:14px;background:rgba(20,16,12,0.8)}
  .followup-box h4{color:#b89a5c;font-size:0.9rem;margin-bottom:10px}

  .followup-input-row input{flex:1;background:#16120e;border:1px solid rgba(184,154,92,0.2);color:#d4ccb8;padding:8px 12px;border-radius:7px;font-size:0.85rem;font-family:inherit;outline:none}

  .followup-input-row .btn-send{background:rgba(184,154,92,0.2);border:1px solid rgba(184,154,92,0.4);color:#b89a5c;padding:8px 18px;border-radius:7px;cursor:pointer;font-size:0.85rem;font-family:inherit;white-space:nowrap}

  .quick-questions{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .quick-questions .qq{background:rgba(184,154,92,0.06);border:1px solid rgba(184,154,92,0.15);color:#a09880;padding:4px 10px;border-radius:12px;font-size:0.75rem;cursor:pointer;font-family:inherit;transition:all 0.2s}
  .quick-questions .qq:hover{background:rgba(184,154,92,0.15);color:#d4bb7c;border-color:rgba(184,154,92,0.3)}

<nav class="sidebar" id="sidebar">
  <h2>术数引擎</h2>

<div class="main">
  <h1>天机阁 · 全板块引擎测试</h1>
  <div class="subtitle">每个板块独立测试，大师不串测 | 支持追问排盘结果 | 纯前端算法，零API</div>
  <div id="content"></div>
</div>

<script src="static/js/masters-engine.js"></script>
<script src="static/js/bazi-engine.js"></script>
<script src="static/js/liuyao-engine.js"></script>
<script src="static/js/meihua-engine.js"></script>
<script src="static/js/qimen-engine.js"></script>
<script src="static/js/taiyi-engine.js"></script>
<script src="static/js/zhuge-engine.js"></script>
<script src="static/js/zhougong-engine.js"></script>
<script src="static/js/daliuren-engine.js"></script>
<script src="static/js/ziwei-engine.js"></script>
<script src="static/js/fengshui-engine.js"></script>

<script>
(function(){
  'use strict';

  // ========== 全局状态 ==========
  var currentEngineId = null;
  var currentResult = null;
  var currentMasterId = null;
  var followupHistory = [];

  // ========== 大师分类 ==========
  function getMastersByCategory(cat) {
    var all = MastersEngine.MASTERS;
    var result = [];
    for (var k in all) {
      if (all.hasOwnProperty(k) && all[k].category === cat) result.push(all[k]);
    }
    return result;
  }

  // ========== 引擎配置 ==========
  var ENGINES = [
    { id:'bazi', name:'八字排盘', icon:'📅', category:'八字', masters:getMastersByCategory('八字'),
      fn:function(){ return BaziEngine.paipan(2000,2,15,8); },
      format:formatBazi },
    { id:'liuyao', name:'六爻占卜', icon:'🪙', category:'六爻', masters:getMastersByCategory('六爻'),
      fn:function(){ var ls=[]; for(var i=0;i<6;i++){ var t=(Math.random()>0.5?3:2)+(Math.random()>0.5?3:2)+(Math.random()>0.5?3:2); ls.push({type:t%2===0?'yin':'yang',changing:t===6||t===9}); } return LiuyaoEngine.divine(ls); },
      format:formatLiuyao },
    { id:'meihua', name:'梅花易数', icon:'🌸', category:'梅花', masters:getMastersByCategory('梅花'),
      fn:function(){ return MeihuaEngine.divine({method:'random'}); },
      format:formatMeihua },
    { id:'qimen', name:'奇门遁甲', icon:'☯️', category:'奇门', masters:getMastersByCategory('奇门'),
      fn:function(){ return QimenEngine.divine('2026-08-02','午时','auto'); },
      format:formatQimen },
    { id:'taiyi', name:'太乙神数', icon:'🌌', category:'太乙', masters:getMastersByCategory('太乙'),
      fn:function(){ return TaiyiEngine.divine('2026-08-02','午时'); },
      format:formatTaiyi },
    { id:'zhuge', name:'诸葛神数', icon:'📜', category:'综合', masters:getMastersByCategory('综合'),
      fn:function(){ var n1=Math.floor(Math.random()*999)+1,n2=Math.floor(Math.random()*999)+1,n3=Math.floor(Math.random()*999)+1; return ZhugeEngine.divine({method:'number',numbers:[n1,n2,n3]}); },
      format:formatZhuge },
    { id:'zhougong', name:'周公解梦', icon:'🌙', category:'解梦', masters:getMastersByCategory('解梦'),
      fn:function(){ return ZhougongEngine.divine('梦见龙飞翔','事业运势'); },
      format:formatZhougong },
    { id:'daliuren', name:'大六壬', icon:'🌊', category:'大六壬', masters:getMastersByCategory('大六壬'),
      fn:function(){ return DaLiuRenEngine.divine('2026-08-02',6); },
      format:formatDaliuren },
    { id:'ziwei', name:'紫微斗数', icon:'🔮', category:'紫微', masters:getMastersByCategory('紫微'),
      fn:function(){ return ZiWeiEngine.paipan({year:2000,month:2,day:15,hour:'辰时',gender:'男',isLunar:false}); },
      format:formatZiwei },
    { id:'fengshui', name:'风水格局', icon:'⛰️', category:'风水', masters:getMastersByCategory('风水'),
      fn:function(){ return FengshuiEngine.fullAnalysis('子','午',2020,2026); },
      format:formatFengshui }
  ];

  // ========== 格式化函数 ==========
  function formatBazi(r) {
    var lines = [];
    lines.push('八字：' + (r.年柱||'?') + '年 ' + (r.月柱||'?') + '月 ' + (r.日柱||'?') + '日 ' + (r.时柱||'?') + '时');
    lines.push('日主：' + (r.日主||'?') + '（' + (r.日主五行||'?') + '）');
    lines.push('生肖：' + (r.生肖||'?'));
    lines.push('纳音：' + (r.年柱纳音||'?') + ' / ' + (r.月柱纳音||'?') + ' / ' + (r.日柱纳音||'?') + ' / ' + (r.时柱纳音||'?'));
    return lines.join('\n');
  }
  function formatLiuyao(r) {
    var lines = [];
    lines.push('卦名：' + (r.gua_name||'?'));
    if(r.original_gua) lines.push('宫位：' + r.original_gua.gong + '宫 | 上卦' + r.original_gua.upper + ' 下卦' + r.original_gua.lower);
    if(r.dong_yao) lines.push('动爻：第' + r.dong_yao + '爻');
    if(r.shi_yao) lines.push('世爻：第' + r.shi_yao + '爻 | 应爻：第' + (r.ying_yao||'?') + '爻');
    if(r.changed_gua) lines.push('变卦：' + r.changed_gua.name);
    if(r.liu_qin) lines.push('六亲：' + r.liu_qin.join(' / '));
    if(r.liu_shou) lines.push('六兽：' + r.liu_shou.join(' / '));
    if(r.interpretation) lines.push('\n【解读】\n' + r.interpretation);
    return lines.join('\n');
  }
  function formatMeihua(r) {
    var lines = [];
    if(r.original_gua) lines.push('本卦：' + r.original_gua);
    if(r.hu_gua) lines.push('互卦：' + r.hu_gua);
    if(r.changed_gua) lines.push('变卦：' + r.changed_gua);
    if(r.ti_gua) lines.push('体卦：' + r.ti_gua + ' | 用卦：' + r.yong_gua);
    if(r.sheng_ke) lines.push('体用生克：' + r.sheng_ke);
    if(r.interpretation) lines.push('\n【解读】\n' + r.interpretation);
    return lines.join('\n');
  }
  function formatQimen(r) {
    var lines = [];
    lines.push('局数：' + (r.ju||'?') + ' | 节气：' + (r.jieqi||'?'));
    lines.push('日干支：' + (r.day_gz||'?') + ' | 时干支：' + (r.time_gz||'?'));
    if(r.interpretation) lines.push('\n【解读】\n' + r.interpretation);
    return lines.join('\n');
  }
  function formatTaiyi(r) {
    var lines = [];
    lines.push('太乙纪元：' + (r.epoch||'?'));
    lines.push('积年：' + (r.ji_nian||'?') + ' | 太乙入：' + (r.taiyi_position||'?'));
    if(r.wufu) lines.push('五福：' + (r.wufu.position||'?'));
    if(r.sanji) lines.push('三基：' + (r.sanji.position||'?'));
    if(r.interpretation) lines.push('\n【解读】\n' + r.interpretation);
    return lines.join('\n');
  }
  function formatZhuge(r) {
    var lines = [];
    lines.push('签号：第' + (r.number||'?') + '签');
    if(r.level) lines.push('等级：' + r.level);
    if(r.poem) lines.push('签诗：' + r.poem);
    if(r.interpretation) lines.push('解签：' + r.interpretation);
    if(r.verdict) lines.push('判断：' + r.verdict);
    return lines.join('\n');
  }
  function formatZhougong(r) {
    var lines = [];
    if(r.input) lines.push('梦境：' + r.input);
    if(r.domain) lines.push('分类：' + r.domain.name + '（' + r.domain.icon + '）');
    if(r.ji) lines.push('吉凶：' + r.ji);
    if(r.count) lines.push('匹配条目：' + r.count + '条');
    if(r.interpretation) lines.push('解梦：' + r.interpretation);
    return lines.join('\n');
  }
  function formatDaliuren(r) {
    var lines = [];
    lines.push('占时：' + (r.ri_gan||'?') + (r.ri_zhi||'?') + '日 | 月将：' + (r.yue_jiang||'?') + '（' + (r.yue_jiang_name||'') + '）');
    if(r.ke_name) lines.push('课体：' + r.ke_name);
    if(r.chuan) lines.push('三传：' + r.chuan);
    if(r.interpretation) lines.push('\n【解读】\n' + r.interpretation);
    return lines.join('\n');
  }
  function formatZiwei(r) {
    var lines = [];
    if(r.命宫) lines.push('命宫：' + r.命宫);
    if(r.命宫主星) lines.push('命宫主星：' + r.命宫主星);
    if(r.身宫) lines.push('身宫：' + r.身宫);
    if(r.五行局) lines.push('五行局：' + r.五行局);
    if(r.紫微星落) lines.push('紫微星落：' + r.紫微星落 + '宫');
    if(r.四化) {
      var sihuaStr = [];
      for(var sk in r.四化) { if(r.四化.hasOwnProperty(sk)) sihuaStr.push(sk + '化' + r.四化[sk]); }
      lines.push('四化：' + sihuaStr.join('、'));
    }
    if(r.十二宫 && r.十二宫.length) {
      lines.push('\n【十二宫概况】');
      for(var gi=0; gi<r.十二宫.length; gi++) {
        var g = r.十二宫[gi];
        lines.push(g.name + '（' + g.zhi + '）：' + (g.stars ? g.stars.join('、') : '无主星'));
      }
    }
    if(r.总体运势) lines.push('\n【总体运势】\n' + r.总体运势);
    if(r.interpretation) lines.push('\n【解读】\n' + r.interpretation);
    return lines.join('\n');
  }
  function formatFengshui(r) {
    var lines = [];
    if(r.sitting) lines.push('坐山：' + r.sitting + ' | 朝向：' + r.facing);
    lines.push('建造年份：' + (r.buildYear||'?') + '年 | 当前年份：' + (r.currentYear||'?') + '年');
    lines.push('元运：' + (r.periodNum||'?') + '运');
    lines.push('综合评分：' + (r.overallScore||'?') + '分 | 等级：' + (r.overallLevel||'?'));
    if(r.bestPalace) lines.push('最佳宫位：' + r.bestPalace.name + '（评分：' + r.bestPalace.score + '分）');
    if(r.worstPalace) lines.push('最差宫位：' + r.worstPalace.name + '（评分：' + r.worstPalace.score + '分）');
    if(r.palaces && r.palaces.length) {
      lines.push('\n【九宫飞星详情】');
      for(var pi=0; pi<r.palaces.length; pi++) {
        var p = r.palaces[pi];
        lines.push(p.name + '：运星' + (p.periodStar||'?') + ' 山星' + (p.mountainStar||'?') + ' 向星' + (p.facingStar||'?') + ' 年星' + (p.annualStar||'?') + ' | ' + (p.score||'?') + '分 ' + (p.level||'?'));
      }
    }
    return lines.join('\n');
  }

  // ========== 大师解读生成 ==========
  function generateMasterAnalysis(eng, result, master) {
    var p = master.pronouns;

    // 对于八字，使用引擎自带的分析
    if(eng.id === 'bazi') {
      return analyzeBaziWithMaster(result, master);
    }

    var lines = [];
    lines.push(p + '以' + master.phrase + '之法，细观此' + eng.name + '之象，为汝剖析如下：');
    lines.push('');

    // 根据引擎类型生成详细分析
    switch(eng.id) {
      case 'liuyao':
        lines = lines.concat(analyzeLiuyaoMaster(result, p, master));
        break;
      case 'meihua':
        lines = lines.concat(analyzeMeihuaMaster(result, p, master));
        break;
      case 'qimen':
        lines = lines.concat(analyzeQimenMaster(result, p, master));
        break;
      case 'taiyi':
        lines = lines.concat(analyzeTaiyiMaster(result, p, master));
        break;
      case 'zhuge':
        lines = lines.concat(analyzeZhugeMaster(result, p, master));
        break;
      case 'zhougong':
        lines = lines.concat(analyzeZhougongMaster(result, p, master));
        break;
      case 'daliuren':
        lines = lines.concat(analyzeDaliurenMaster(result, p, master));
        break;
      case 'ziwei':
        lines = lines.concat(analyzeZiweiMaster(result, p, master));
        break;
      case 'fengshui':
        lines = lines.concat(analyzeFengshuiMaster(result, p, master));
        break;
      default:
        lines.push(p + '此' + eng.name + '之象，吉凶已现，汝当以' + master.phrase + '之法参之。');
    }

    return lines.join('\n');
  }

  // ---- 各引擎大师分析函数 ----
  function analyzeLiuyaoMaster(r, p, m) {
    var lines = [];
    lines.push('【卦象总览】');
    lines.push(p + '观此' + (r.gua_name||'卦') + '之象，' + (r.original_gua ? '属' + r.original_gua.gong + '宫，上卦' + r.original_gua.upper + '为天，下卦' + r.original_gua.lower + '为地，' : '') + '天地交感，万象生焉。');
    
    lines.push('');
    lines.push('【世应分析】');
    if(r.shi_yao && r.ying_yao) {
      lines.push(p + '世爻居第' + r.shi_yao + '位，为汝自身之象；应爻居第' + r.ying_yao + '位，为所问之事。' +
        '世应相生则吉，相克则凶。' + (r.shi_yao === r.ying_yao ? '世应同位，此事与汝息息相关，不可轻忽。' : '世应之位已定，吉凶自现。'));
    }

    if(r.dong_yao) {
      lines.push('');
      lines.push('【动爻精解】');
      lines.push(p + '此卦动爻在第' + r.dong_yao + '位，此为关键之变。' +
        '动则生变，变则有机。' + (r.liu_qin && r.liu_qin[r.dong_yao-1] ? '动爻六亲为' + r.liu_qin[r.dong_yao-1] + '，' + r.liu_qin[r.dong_yao-1] + '发动，其力倍增。' : '') +
        (r.liu_shou && r.liu_shou[r.dong_yao-1] ? '临' + r.liu_shou[r.dong_yao-1] + '，' + getShouDesc(r.liu_shou[r.dong_yao-1]) : ''));
    }

    if(r.changed_gua) {
      lines.push('');
      lines.push('【变卦推演】');
      lines.push(p + '本卦' + (r.gua_name||'') + '变而为' + r.changed_gua.name + '，此乃事态发展之趋势。' +
        '变卦为事之终，观变卦可知结局。');
    }

    if(r.liu_qin) {
      lines.push('');
      lines.push('【六亲六兽】');
      lines.push(p + '六亲：' + r.liu_qin.join('、') + '。各有所主，或为财，或为官，或为父兄。');
      if(r.liu_shou) lines.push('六兽：' + r.liu_shou.join('、') + '。青龙主喜，白虎主凶，各有所应。');
    }

    if(r.interpretation) {
      lines.push('');
      lines.push('【综合断语】');
      lines.push(p + '综合断之：' + r.interpretation);
    }
    return lines;
  }

  function analyzeMeihuaMaster(r, p, m) {
    var lines = [];
    lines.push('【卦象推演】');
    var origName = r.original_gua || '';

  // ========== 追问功能 ==========
  function generateFollowupResponse(eng, result, master, question) {
    var p = master.pronouns;
    var lines = [];
    
    lines.push(p + '闻汝之问，再以' + master.phrase + '之法，为汝细解：');
    lines.push('');

    // 根据引擎类型生成针对性回答
    switch(eng.id) {
      case 'bazi':
        lines = lines.concat(followupBazi(result, p, question));
        break;
      case 'liuyao':
        lines = lines.concat(followupLiuyao(result, p, question));
        break;
      case 'meihua':
        lines = lines.concat(followupMeihua(result, p, question));
        break;
      case 'qimen':
        lines = lines.concat(followupQimen(result, p, question));
        break;
      case 'taiyi':
        lines = lines.concat(followupTaiyi(result, p, question));
        break;
      case 'zhuge':
        lines = lines.concat(followupZhuge(result, p, question));
        break;
      case 'zhougong':
        lines = lines.concat(followupZhougong(result, p, question));
        break;
      case 'daliuren':
        lines = lines.concat(followupDaliuren(result, p, question));
        break;
      case 'ziwei':
        lines = lines.concat(followupZiwei(result, p, question));
        break;
      case 'fengshui':
        lines = lines.concat(followupFengshui(result, p, question));
        break;
      default:
        lines.push(p + '汝所问"' + question + '"，' + '天地之道，阴阳五行，万物皆在其中。汝之所问，亦不出此理。');
    }

    lines.push('');
    lines.push(p + '总而言之，' + master.phrase + '。命理不外乎人情，天道不离乎人事。汝当以平常心待之，顺势而为，则吉无不利。');

    return lines.join('\n');
  }

  // ---- 各引擎追问函数 ----
  function followupBazi(r, p, q) {
    var lines = [];
    var nianZhu = r.年柱 || '';
    var yueZhu = r.月柱 || '';
    var riZhu = r.日柱 || '';
    var shiZhu = r.时柱 || '';
    var riZhuWx = r.日主五行 || '';
    var riZhuGan = r.日主 || '';
    var riZhi = r.日支 || '';
    var shengXiao = r.生肖 || '';
    
    lines.push(p + '前已推汝八字：' + nianZhu + '年 ' + yueZhu + '月 ' + riZhu + '日 ' + shiZhu + '时，' +
      '日主' + riZhuGan + '属' + riZhuWx + '，生肖' + shengXiao + '。');

    if(q.indexOf('财运')>=0 || q.indexOf('财')>=0 || q.indexOf('钱')>=0) {
      lines.push(p + '● 论汝财运：' + riZhuWx + '日主，我克者为财。');
      lines.push(p + '财为养命之源，亦为驱使之物。' + riZhuWx + '日主之财星为' + (riZhuWx==='木'?'土':riZhuWx==='火'?'金':riZhuWx==='土'?'水':riZhuWx==='金'?'木':'火') + '，');

        keName.indexOf('涉害')>=0 ? '涉害课主波折，需谨慎应对。' :
        keName.indexOf('遥克')>=0 ? '遥克课主远距离之影响，需关注远方之事。' :
        keName.indexOf('昴星')>=0 ? '昴星课主暗中有变，需细心观察。' :
        '课体为纲，三传为目，纲举目张，万事可明。'));
    } else {
      lines.push(p + '汝问"' + q + '"，六壬之道，以天地盘为基，四课三传为用。' +
        '课体' + keName + '，三传' + chuan + '，' +
        '观三传之生克，可知事之吉凶。' +
        '六壬之术，与太乙、奇门并称三式，乃术数之巅峰。');
    }
    return lines;
  }

  function followupZiwei(r, p, q) {
    var lines = [];
    var mingGong = r.命宫 || '';
    var zhuXing = r.命宫主星 || '';
    var shenGong = r.身宫 || '';
    var wuxingJu = r.五行局 || '';
    var gongs = r.十二宫 || [];
    var sihua = r.四化 || {};
    
    lines.push(p + '前推汝紫微命盘：' + mingGong + '为命宫，' +
      '主星' + (zhuXing || '无主星') + '。' +
      shenGong + '为身宫，得' + wuxingJu + '，紫微星落' + (r.紫微星落||'') + '宫。');

    if(q.indexOf('事业')>=0 || q.indexOf('官禄')>=0 || q.indexOf('工作')>=0) {
      lines.push(p + '官禄宫乃事业之宫，观其星曜组合，可知事业方向与成就。');
      // 从十二宫中找到官禄宫
      for(var gi=0; gi<gongs.length; gi++) {
        if(gongs[gi].name === '官禄') {
          lines.push(p + '汝官禄宫在' + gongs[gi].zhi + '，' +
            (gongs[gi].stars && gongs[gi].stars.length ? '有' + gongs[gi].stars.join('、') + '坐守。' : '无主星。'));
        }
      }
      lines.push(p + '命宫主星' + zhuXing + '决定了汝之天赋与职业倾向。' +
        '官禄宫之星曜配合命宫，方能确定事业之方向。' +
        '若官禄宫吉星汇聚，事业顺遂；若有煞星冲破，则需以勤补拙。');
    } else if(q.indexOf('财')>=0 || q.indexOf('财帛')>=0) {
      lines.push(p + '财帛宫乃财运之宫，观其星曜，可知求财之难易与财富之格局。');
      for(var gi=0; gi<gongs.length; gi++) {
        if(gongs[gi].name === '财帛') {
          lines.push(p + '汝财帛宫在' + gongs[gi].zhi + '，' +
            (gongs[gi].stars && gongs[gi].stars.length ? '有' + gongs[gi].stars.join('、') + '坐守。' : '无主星。'));
        }
      }
      lines.push(p + '财帛宫之吉凶，需结合命宫与福德宫合参。' +
        '命宫主星' + zhuXing + '，' + wuxingJu + '，' +
        '财星旺则求财易，财星弱则需勤勉。' +
        '四化之中，化禄入财帛则财源广进，化忌入财帛则需谨慎理财。');
    } else if(q.indexOf('感情')>=0 || q.indexOf('夫妻')>=0 || q.indexOf('婚姻')>=0) {
      lines.push(p + '夫妻宫乃姻缘之宫，观其星曜，可知婚姻质量与配偶特征。');
      for(var gi=0; gi<gongs.length; gi++) {
        if(gongs[gi].name === '夫妻') {
          lines.push(p + '汝夫妻宫在' + gongs[gi].zhi + '，' +
            (gongs[gi].stars && gongs[gi].stars.length ? '有' + gongs[gi].stars.join('、') + '坐守。' : '无主星。'));
        }
      }
      lines.push(p + '夫妻宫与命宫之关系，决定了姻缘之路。' +
        '命宫' + mingGong + '与夫妻宫之生克，关乎婚姻之和谐。' +
        '若夫妻宫有桃花星，异性缘佳但需防烂桃花；' +
        '若夫妻宫有煞星，则需以包容之心化解矛盾。');
    } else if(q.indexOf('健康')>=0 || q.indexOf('疾厄')>=0) {
      lines.push(p + '疾厄宫乃健康之宫，观其星曜，可知体质强弱与易患之疾。');
      for(var gi=0; gi<gongs.length; gi++) {
        if(gongs[gi].name === '疾厄') {
          lines.push(p + '汝疾厄宫在' + gongs[gi].zhi + '，' +
            (gongs[gi].stars && gongs[gi].stars.length ? '有' + gongs[gi].stars.join('、') + '坐守。' : '无主星。'));
        }
      }
      lines.push(p + '命宫' + mingGong + '，' + wuxingJu + '，' +
        '五行之平衡关乎健康。' +
        '疾厄宫有吉星则体质强健，有煞星则需注意对应脏腑之保养。');
    } else {
      lines.push(p + '紫微斗数，十二宫各有其主，十四主星各有所司。' +
        '汝问"' + q + '"，需观对应宫位之星曜组合方知。' +
        '命宫' + mingGong + '为根，' + shenGong + '为干，' +
        '其余十宫为枝叶，合而观之，方知命途全貌。');
    }
    return lines;
  }

  function followupFengshui(r, p, q) {
    var lines = [];
    lines.push(p + '前已推' + (r.sitting||'') + '山' + (r.facing||'') + '向，' +
      (r.periodNum||'') + '运之宅，综合评分' + (r.overallScore||'') + '分。');

    if(q.indexOf('财位')>=0 || q.indexOf('财运')>=0) {
      lines.push(p + '财位之寻，以向星为主。' + (r.palaces && r.palaces.length ? '纵观九宫：' +
        (function(){
          var cai = [];
          for(var i=0;i<r.palaces.length;i++){
            if(r.palaces[i].facingStar===8||r.palaces[i].facingStar===1||r.palaces[i].facingStar===6||r.palaces[i].facingStar===9)
              cai.push(r.palaces[i].name);
          }
          return cai.length ? cai.join('、') + '为财位。' : '需结合具体飞星确定。';
        })() : ''));
    } else if(q.indexOf('化解')>=0 || q.indexOf('凶位')>=0) {
      lines.push(p + '凶位之化解，以五行生克为法。' + (r.worstPalace ? 
        '最凶之' + r.worstPalace.name + '（评分' + r.worstPalace.score + '），' +
        '可以金器、铜铃等金属风水物化解，或以白色、金色布置。' : ''));
    } else if(q.indexOf('健康')>=0) {
      lines.push(p + '健康与山星相关。' + (r.palaces && r.palaces.length ? 
        '九宫之中，山星吉者宜居，山星凶者宜避。' : '') +
        '卧室宜设在山星吉位，以保健康平安。');
    } else {
      lines.push(p + '风水之道，首重峦头理气。' +
        (r.bestPalace ? '最佳方位' + r.bestPalace.name + '宜善加利用，' : '') +
        (r.worstPalace ? '最差方位' + r.worstPalace.name + '需谨慎处理。' : '') +
        '九宫飞星，年年流转，须因时制宜。');
    }
    return lines;
  }

  // ========== 构建侧边栏 ==========
  var sidebar = document.getElementById('sidebar');
  for(var ei=0; ei<ENGINES.length; ei++) {
    (function(eng){
      var btn = document.createElement('button');
      btn.className = 'engine-btn';
      btn.innerHTML = eng.icon + ' ' + eng.name + ' <span style="color:#6a6556;font-size:0.7rem">(' + eng.masters.length + '位)</span>';
      btn.addEventListener('click', function(){ selectEngine(eng.id); });
      sidebar.appendChild(btn);
    })(ENGINES[ei]);
  }

  function selectEngine(id) {
    currentEngineId = id;
    currentResult = null;
    currentMasterId = null;
    followupHistory = [];

    var btns = sidebar.querySelectorAll('.engine-btn');
    for(var bi=0; bi<btns.length; bi++) {
      btns[bi].classList.toggle('active', ENGINES[bi] && ENGINES[bi].id === id);
    }
    renderEngine(id);
  }

  function findEngine(id) {
    for(var ei=0; ei<ENGINES.length; ei++) {
      if(ENGINES[ei].id === id) return ENGINES[ei];
    }
    return null;
  }

  function renderEngine(id) {
    var eng = findEngine(id);
    if(!eng) return;
    var content = document.getElementById('content');

    var result = eng.fn();
    currentResult = result;
    // 默认选第一个大师
    if(eng.masters.length > 0) currentMasterId = eng.masters[0].id;

    var formatted = eng.format(result);
    var html = '';

    // 引擎头部
    html += '<div class="eng-header">';
    html += '<h3>' + eng.icon + ' ' + eng.name + '</h3>';
    html += '<div class="info">流派：' + eng.category + ' | 专属大师：' + eng.masters.length + '位 | <span style="color:#8a8576">点击大师标签切换解读</span></div>';
    html += '<div class="masters-list" id="mastersTags">';
    for(var mi=0; mi<eng.masters.length; mi++) {
      var m = eng.masters[mi];
      html += '<span class="master-tag' + (m.id === currentMasterId ? ' selected' : '') + '" data-master-id="' + m.id + '">' + m.name + '</span>';
    }
    html += '</div>';
    html += '<button class="btn" style="margin-top:8px" onclick="window._rerunTest()">重新排盘</button>';
    html += '</div>';

    // 引擎原始输出
    html += '<div class="card">';
    html += '<div class="card-hd"><span class="title">引擎原始输出</span><span class="meta">' + eng.name + '</span></div>';
    html += '<div class="card-bd"><span class="stat">字数：' + formatted.replace(/[^\u4e00-\u9fa5]/g,'').length + '字</span><pre>' + escapeHtml(formatted) + '</pre></div>';
    html += '</div>';

    // 大师解读
    if(currentMasterId && eng.masters.length > 0) {
      var master = MastersEngine.MASTERS[currentMasterId];
      if(master) {
        var analysis = generateMasterAnalysis(eng, result, master);
        html += '<div class="card" id="masterAnalysisCard">';
        html += '<div class="card-hd"><span class="title">大师解读 · ' + master.name + '</span><span class="meta">' + master.era + ' · ' + master.title + '</span></div>';
        html += '<div class="card-bd"><div class="analysis-text">' + formatAnalysisText(analysis) + '</div></div>';
        html += '</div>';
      }
    }

    // 追问区域
    html += '<div class="followup-box">';
    html += '<h4>追问大师 — 对此次排盘结果进行深入追问</h4>';
    html += '<div class="quick-questions" id="quickQuestions"></div>';
    html += '<div class="followup-input-row">';
    html += '<input type="text" id="followupInput" placeholder="输入你想追问的问题，如：我的财运何时好转？...">';
    html += '<button class="btn-send" id="followupSend">追问</button>';
    html += '</div>';
    html += '<div class="followup-history" id="followupHistory"></div>';
    html += '</div>';

    content.innerHTML = html;

    // 绑定大师标签点击
    bindMasterTags(eng);
    // 绑定追问
    bindFollowup(eng);
    // 生成快捷追问
    generateQuickQuestions(eng);
  }

  function bindMasterTags(eng) {
    var tags = document.querySelectorAll('.master-tag');
    for(var ti=0; ti<tags.length; ti++) {
      tags[ti].addEventListener('click', function(){
        var mid = this.dataset.masterId;
        currentMasterId = mid;
        // 更新选中状态
        var allTags = document.querySelectorAll('.master-tag');
        for(var ai=0; ai<allTags.length; ai++) {
          allTags[ai].classList.toggle('selected', allTags[ai].dataset.masterId === mid);
        }
        // 更新大师解读
        var master = MastersEngine.MASTERS[mid];
        if(master && currentResult) {
          var analysis = generateMasterAnalysis(eng, currentResult, master);
          var card = document.getElementById('masterAnalysisCard');
          if(card) {
            card.querySelector('.card-hd').innerHTML = '<span class="title">大师解读 · ' + master.name + '</span><span class="meta">' + master.era + ' · ' + master.title + '</span>';
            card.querySelector('.analysis-text').innerHTML = formatAnalysisText(analysis);
          }
        }
      });
    }
  }

  function bindFollowup(eng) {
    var input = document.getElementById('followupInput');
    var sendBtn = document.getElementById('followupSend');
    var history = document.getElementById('followupHistory');

    function doSend() {
      var q = input.value.trim();
      if(!q) return;
      if(!currentMasterId || !currentResult) return;

      var master = MastersEngine.MASTERS[currentMasterId];
      if(!master) return;

      // 添加问题
      followupHistory.push({type:'question', text:q});
      
      // 生成回答
      var answer = generateFollowupResponse(eng, currentResult, master, q);
      followupHistory.push({type:'answer', text:answer, master:master.name});

      renderFollowupHistory();
      input.value = '';
      input.focus();
    }

    sendBtn.addEventListener('click', doSend);
    input.addEventListener('keydown', function(e){
      if(e.key === 'Enter') doSend();
    });
  }

  function renderFollowupHistory() {
    var el = document.getElementById('followupHistory');
    if(!el) return;
    var html = '';
    for(var i=0; i<followupHistory.length; i++) {
      var msg = followupHistory[i];
      if(msg.type === 'question') {
        html += '<div class="followup-msg question"><div class="msg-label">你的追问</div>' + escapeHtml(msg.text) + '</div>';
      } else {
        html += '<div class="followup-msg answer"><div class="msg-label"><span class="msg-master">' + msg.master + '</span> 的回答</div>' + formatAnalysisText(msg.text) + '</div>';
      }
    }
    el.innerHTML = html;
    el.scrollTop = el.scrollHeight;
  }

  function generateQuickQuestions(eng) {
    var el = document.getElementById('quickQuestions');
    if(!el) return;
    var questions = [];
    if(eng.id === 'bazi') {
      questions = ['我的财运何时有转机？正财偏财哪个更旺？', '事业方向应该如何选择？何时有升职机会？', '婚姻感情运势如何？正缘在哪个大运出现？', '今年丙午流年对我有何影响？需要注意什么？', '五行是否平衡？健康方面需要关注什么？'];
    } else if(eng.id === 'liuyao') {
      questions = ['此卦动爻如何解读？变卦预示什么走向？', '世爻与应爻的关系如何？吉凶倾向怎样？', '六亲中哪个最关键？六兽各有什么含义？', '此卦对事业/财运的启示是什么？', '变卦与原卦的吉凶对比如何？'];
    } else if(eng.id === 'meihua') {
      questions = ['体用生克关系如何？吉凶倾向怎样？', '互卦揭示了什么隐藏因素？', '变卦预示什么最终结局？如何趋吉避凶？', '本卦、互卦、变卦三卦如何合参？', '万物类象如何应用到具体问题中？'];
    } else if(eng.id === 'qimen') {
      questions = ['哪个宫位最吉利？八门中哪个门适合我？', '九星对我的影响如何？哪个星最有利？', '如何选择最佳时辰？什么时辰该做什么事？', '天时地利人和，当前哪方面最有利？', '此局对事业/财运/健康有何启示？'];
    } else if(eng.id === 'taiyi') {
      questions = ['太乙入宫的含义是什么？对大局有何影响？', '五福临门如何解读？应在哪个领域？', '三基的作用是什么？君基臣基民基各主什么？', '积年之数如何推算？有何历史依据？', '太乙神数与奇门遁甲、大六壬有何异同？'];
    } else if(eng.id === 'zhuge') {
      questions = ['此签的深层含义是什么？如何理解签中隐喻？', '签诗每句如何解读？有什么典故？', '此签对当前处境的启示是什么？', '历史上类似签文应验的案例有哪些？', '签中的吉凶判断有何依据？'];
    } else if(eng.id === 'zhougong') {
      questions = ['这个梦有什么深层征兆？预示着什么？', '梦中的象征物如何解读？各有什么寓意？', '这个梦对应现实中的哪些方面？', '如何化解噩梦？有哪些安神的方法？', '重复出现的梦境意味着什么？'];
    } else if(eng.id === 'daliuren') {
      questions = ['课体' + (currentResult && currentResult.ke_name ? currentResult.ke_name : '') + '如何详细解读？', '三传预示什么？初传中传末传各主什么？', '月将的作用是什么？与课体有何关系？', '四课三传如何合参？吉凶如何判断？', '六壬与其他术数相比有何独特之处？'];
    } else if(eng.id === 'ziwei') {
      questions = ['命宫主星如何详细解读？各星曜有何特性？', '事业宫（官禄宫）有什么星曜？适合什么职业？', '财帛宫情况如何？正财运和偏财运怎样？', '夫妻宫如何？正缘何时出现？配偶特征如何？', '四化飞星（禄权科忌）对我的影响是什么？'];
    } else if(eng.id === 'fengshui') {
      questions = ['财位在哪个方位？如何布置才能旺财？', '凶位如何化解？有哪些具体的风水调整方法？', '健康方面需要注意哪些方位？', '最佳方位如何利用？宜做什么用途？', '九宫飞星详解？今年年星飞布情况如何？'];
    } else {
      questions = ['这个结果如何详细解读？有哪些深层含义？', '有什么需要注意的风险和机遇？', '吉凶如何判断？有何依据？', '能再详细解释一下背后的原理吗？'];
    }
    var html = '';
    for(var qi=0; qi<questions.length; qi++) {
      html += '<button class="qq">' + questions[qi] + '</button>';
    }
    el.innerHTML = html;

    var btns = el.querySelectorAll('.qq');
    var input = document.getElementById('followupInput');
    for(var bi=0; bi<btns.length; bi++) {
      btns[bi].addEventListener('click', function(){
        if(input) {
          input.value = this.textContent;
          input.focus();
        }
      });
    }
  }

  function formatAnalysisText(text) {
    return escapeHtml(text)
      .replace(/【(\w+)】/g, '<strong>【$1】</strong>')
      .replace(/\n/g, '<br>');
  }

  function escapeHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // 暴露到全局
  window._rerunTest = function(){
    if(currentEngineId) renderEngine(currentEngineId);
  };

  // 默认选中第一个
  if(ENGINES.length > 0) selectEngine(ENGINES[0].id);

})();
</script>
