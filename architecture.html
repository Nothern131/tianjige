<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>天机阁 · 系统架构</title>
    <style>
      /* ===== 基础 ===== */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --bg: #08070e;
        --surface: rgba(14, 12, 24, 0.92);
        --card: rgba(16, 14, 26, 0.78);
        --gold: #b89a5c;
        --gold-light: #d4bb7c;
        --gold-glow: rgba(184, 154, 92, 0.12);
        --text: #e0dcd0;
        --text2: #8a8576;
        --text3: #4a4640;
        --border: rgba(255, 255, 255, 0.04);
        --border-gold: rgba(184, 154, 92, 0.16);
        --red: #c94a3a;
        --green: #4a8a5c;
        --blue: #4a8ac9;
        --purple: #8a6ab8;
        --teal: #4a9a8c;
        --font-serif: 'Noto Serif SC', 'SimSun', serif;
        --font-sans: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      html {
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-sans);
        overflow-x: hidden;
      }
      body {
        min-height: 100vh;
        user-select: none;
        -webkit-user-select: none;
      }

      /* 星空背景 */
      #starfield {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
      }

      /* 主容器 */
      .wrap {
        position: relative;
        z-index: 1;
        max-width: 1400px;
        margin: 0 auto;
        padding: 40px 24px 80px;
      }

      /* 标题 */
      .header {
        text-align: center;
        padding: 48px 0 8px;
      }
      .header h1 {
        font-family: var(--font-serif);
        font-size: clamp(1.8rem, 4vw, 2.6rem);
        color: var(--gold-light);
        letter-spacing: 0.12em;
        font-weight: 700;
      }
      .header p {
        font-size: 0.88rem;
        color: var(--text2);
        margin-top: 8px;
        letter-spacing: 0.06em;
      }
      .header .divider {
        width: 60px;
        height: 1px;
        background: var(--border-gold);
        margin: 20px auto 0;
      }

      /* 导航标签 */
      .tab-bar {
        display: flex;
        justify-content: center;
        gap: 4px;
        margin: 32px 0 24px;
        flex-wrap: wrap;
      }
      .tab-btn {
        padding: 8px 20px;
        border: 1px solid var(--border);
        border-radius: 20px;
        background: transparent;
        color: var(--text2);
        font-size: 0.82rem;
        cursor: pointer;
        transition: all 0.25s;
        font-family: var(--font-sans);
        letter-spacing: 0.04em;
      }
      .tab-btn:hover {
        color: var(--gold);
        border-color: var(--border-gold);
      }
      .tab-btn.active {
        background: rgba(184, 154, 92, 0.1);
        color: var(--gold-light);
        border-color: var(--border-gold);
        box-shadow: 0 0 12px var(--gold-glow);
      }

      .tab-panel {
        display: none;
      }
      .tab-panel.active {
        display: block;
      }

      /* ===== Tab 1: SVG 架构图 ===== */
      .svg-wrap {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 8px;
        overflow-x: auto;
      }
      .svg-wrap svg {
        display: block;
        width: 100%;
        min-width: 1100px;
        height: auto;
      }

      /* ===== Tab 2: 动态流转图 ===== */
      .flow-wrap {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .flow-stage {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
        transition: all 0.35s;
      }
      .flow-stage:hover {
        border-color: var(--border-gold);
        box-shadow: 0 0 20px var(--gold-glow);
      }
      .flow-stage-head {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 16px 20px;
        cursor: pointer;
        transition: background 0.25s;
      }
      .flow-stage-head:hover {
        background: rgba(184, 154, 92, 0.03);
      }
      .flow-stage-num {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-serif);
        font-size: 1rem;
        font-weight: 700;
        flex-shrink: 0;
      }
      .flow-stage-icon {
        font-size: 1.3rem;
        flex-shrink: 0;
      }
      .flow-stage-title {
        font-family: var(--font-serif);
        font-size: 1.05rem;
        color: var(--gold);
        font-weight: 600;
        letter-spacing: 0.04em;
      }
      .flow-stage-desc {
        font-size: 0.78rem;
        color: var(--text2);
        margin-left: auto;
        text-align: right;
        flex-shrink: 0;
      }
      .flow-stage-arrow {
        font-size: 0.8rem;
        color: var(--text3);
        margin-left: 8px;
        transition: transform 0.3s;
      }
      .flow-stage.open .flow-stage-arrow {
        transform: rotate(180deg);
      }
      .flow-stage-body {
        display: none;
        padding: 0 20px 20px 68px;
      }
      .flow-stage.open .flow-stage-body {
        display: block;
      }
      .flow-detail {
        padding: 12px 16px;
        background: rgba(184, 154, 92, 0.03);
        border: 1px solid var(--border);
        border-radius: 8px;
        margin-bottom: 8px;
        font-size: 0.82rem;
        color: var(--text2);
        line-height: 1.8;
      }
      .flow-detail strong {
        color: var(--gold-light);
      }
      .flow-detail code {
        font-family: monospace;
        font-size: 0.78rem;
        background: rgba(184, 154, 92, 0.08);
        padding: 1px 6px;
        border-radius: 4px;
        color: var(--gold);
      }

      /* 连线 */
      .flow-line {
        display: flex;
        justify-content: center;
        padding: 4px 0;
      }
      .flow-line svg {
        width: 40px;
        height: 32px;
      }

      /* ===== Tab 3: 节点交互 ===== */
      .node-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 14px;
      }
      .node-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 18px;
        cursor: pointer;
        transition: all 0.3s;
        position: relative;
        overflow: hidden;
      }
      .node-card:hover {
        border-color: var(--border-gold);
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      }
      .node-card.selected {
        border-color: var(--border-gold);
        box-shadow:
          0 0 24px var(--gold-glow),
          inset 0 0 24px rgba(184, 154, 92, 0.02);
      }
      .node-card.selected::after {
        content: '✓';
        position: absolute;
        top: 10px;
        right: 12px;
        font-size: 0.7rem;
        color: var(--gold);
        font-weight: 700;
      }
      .node-card-header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }
      .node-card-icon {
        font-size: 1.4rem;
      }
      .node-card-name {
        font-family: var(--font-serif);
        font-size: 0.95rem;
        color: var(--text);
        font-weight: 600;
      }
      .node-card-type {
        font-size: 0.65rem;
        padding: 2px 8px;
        border-radius: 8px;
        border: 1px solid var(--border);
        color: var(--text3);
        margin-left: auto;
      }
      .node-card-desc {
        font-size: 0.78rem;
        color: var(--text2);
        line-height: 1.6;
        margin-bottom: 10px;
      }
      .node-card-tags {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .node-card-tag {
        font-size: 0.64rem;
        padding: 2px 8px;
        border-radius: 6px;
        background: rgba(184, 154, 92, 0.04);
        border: 1px solid var(--border);
        color: var(--text3);
      }

      /* 详情面板 */
      .detail-panel {
        display: none;
        margin-top: 20px;
        background: var(--card);
        border: 1px solid var(--border-gold);
        border-radius: 12px;
        padding: 24px;
        animation: fadeUp 0.35s ease-out;
      }
      .detail-panel.active {
        display: block;
      }
      .detail-panel h3 {
        font-family: var(--font-serif);
        font-size: 1.1rem;
        color: var(--gold-light);
        margin-bottom: 16px;
        letter-spacing: 0.04em;
      }
      .detail-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.82rem;
      }
      .detail-table th,
      .detail-table td {
        padding: 10px 14px;
        text-align: left;
        border-bottom: 1px solid var(--border);
      }
      .detail-table th {
        font-family: var(--font-serif);
        color: var(--gold);
        font-weight: 600;
        font-size: 0.78rem;
        letter-spacing: 0.04em;
      }
      .detail-table td {
        color: var(--text2);
      }
      .detail-table tr:last-child td {
        border-bottom: none;
      }
      .detail-code {
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 14px;
        margin-top: 12px;
        font-family: monospace;
        font-size: 0.76rem;
        color: var(--text2);
        line-height: 1.7;
        white-space: pre-wrap;
        overflow-x: auto;
      }

      /* ===== Tab 4: Demo ===== */
      .demo-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 28px;
        background: rgba(184, 154, 92, 0.12);
        border: 1px solid var(--border-gold);
        border-radius: 24px;
        color: var(--gold-light);
        font-family: var(--font-serif);
        font-size: 0.95rem;
        cursor: pointer;
        transition: all 0.3s;
        letter-spacing: 0.06em;
      }
      .demo-btn:hover {
        background: rgba(184, 154, 92, 0.2);
        box-shadow: 0 0 20px var(--gold-glow);
      }
      .demo-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .demo-log {
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 20px;
        margin-top: 16px;
        max-height: 500px;
        overflow-y: auto;
        font-family: monospace;
        font-size: 0.76rem;
        line-height: 1.8;
      }
      .demo-log .log-step {
        color: var(--gold);
        margin-top: 8px;
      }
      .demo-log .log-info {
        color: var(--text2);
      }
      .demo-log .log-result {
        color: var(--green);
      }
      .demo-log .log-time {
        color: var(--text3);
        font-size: 0.7rem;
      }
      .demo-input {
        display: flex;
        gap: 12px;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }
      .demo-input input {
        flex: 1;
        min-width: 200px;
        padding: 10px 16px;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        font-size: 0.88rem;
        outline: none;
        font-family: var(--font-sans);
        transition: border-color 0.25s;
      }
      .demo-input input:focus {
        border-color: var(--border-gold);
      }

      /* 动画 */
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }
      @keyframes flowDash {
        to {
          stroke-dashoffset: -24;
        }
      }

      /* 水印 */
      .watermark {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) rotate(-25deg);
        font-size: 6rem;
        color: rgba(184, 154, 92, 0.015);
        pointer-events: none;
        z-index: 0;
        font-family: var(--font-serif);
        white-space: nowrap;
        letter-spacing: 0.3em;
      }

      /* 响应式 */
      @media (max-width: 768px) {
        .wrap {
          padding: 24px 16px 60px;
        }
        .node-grid {
          grid-template-columns: 1fr;
        }
        .flow-stage-desc {
          display: none;
        }
        .flow-stage-body {
          padding: 0 12px 16px 48px;
        }
      }
    </style>
    <link rel="stylesheet" crossorigin href="./assets/style-CkcVZCYg.css">
  </head>
  <body>
    <canvas id="starfield"></canvas>
    <div class="watermark">天机阁</div>

    <div class="wrap">
      <div class="header">
        <h1>天 机 阁</h1>
        <p>系统架构 · 数据流转 · 模块交互</p>
        <div class="divider"></div>
      </div>

      <!-- 导航标签 -->
      <div class="tab-bar">
        <button class="tab-btn active" data-tab="arch">架构总览</button>
        <button class="tab-btn" data-tab="flow">动态流转</button>
        <button class="tab-btn" data-tab="nodes">节点交互</button>
        <button class="tab-btn" data-tab="demo">演示 Demo</button>
      </div>

      <!-- ===== Tab 1: SVG 架构总览 ===== -->
      <div class="tab-panel active" id="panel-arch">
        <div class="svg-wrap" id="svg-wrap"></div>
      </div>

      <!-- ===== Tab 2: 动态流转图 ===== -->
      <div class="tab-panel" id="panel-flow">
        <div class="flow-wrap" id="flow-wrap"></div>
      </div>

      <!-- ===== Tab 3: 节点交互 ===== -->
      <div class="tab-panel" id="panel-nodes">
        <div class="node-grid" id="node-grid"></div>
        <div class="detail-panel" id="detail-panel"></div>
      </div>

      <!-- ===== Tab 4: Demo ===== -->
      <div class="tab-panel" id="panel-demo">
        <div style="background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px">
          <h3
            style="
              font-family: var(--font-serif);
              color: var(--gold);
              margin-bottom: 8px;
              font-size: 1.05rem;
              letter-spacing: 0.04em;
            "
          >
            模拟合参流程
          </h3>
          <p style="font-size: 0.8rem; color: var(--text2); margin-bottom: 20px">
            输入问题，观察系统如何从输入流转到最终输出
          </p>
          <div class="demo-input">
            <input
              type="text"
              id="demo-question"
              placeholder="输入你的问题，如：跳槽去大厂还是考公？"
              value="互联网工作5年，纠结继续大厂还是考公"
            />
          </div>
          <button class="demo-btn" id="demo-btn" onclick="runDemo()">启动合参推演</button>
          <div class="demo-log" id="demo-log">
            <div class="log-info">等待输入问题，点击按钮开始推演...</div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // ===== 代码保护 =====
      (function () {
        // 禁止右键菜单
        document.addEventListener('contextmenu', function (e) {
          e.preventDefault();
          return false;
        });
        // 禁止拖拽
        document.addEventListener('dragstart', function (e) {
          e.preventDefault();
          return false;
        });
        // 禁止选择（CSS已设，JS兜底）
        document.addEventListener('selectstart', function (e) {
          e.preventDefault();
          return false;
        });
        // 控制台版权声明
        console.clear();
        console.log(
          '%c 天机阁 · 系统架构 %c v1.0 ',
          'font-family:"Noto Serif SC",serif;font-size:24px;color:#d4bb7c;padding:12px 0;',
          'font-size:12px;color:#8a8576;'
        );
        console.log('%c 纯前端算法架构 | 零API调用 | 模块化引擎设计 ', 'font-size:12px;color:#4a8a5c;');
        console.log('%c © 2025 天机阁 | 保留所有权利 ', 'font-size:10px;color:#4a4640;');
        // 键盘拦截
        document.addEventListener('keydown', function (e) {
          // F12
          if (e.keyCode === 123) {
            e.preventDefault();
            return false;
          }
          // Ctrl+Shift+I / Ctrl+Shift+J / Ctrl+Shift+C
          if (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) {
            e.preventDefault();
            return false;
          }
          // Ctrl+U (查看源码)
          if (e.ctrlKey && e.keyCode === 85) {
            e.preventDefault();
            return false;
          }
          // Ctrl+S (保存页面)
          if (e.ctrlKey && e.keyCode === 83) {
            e.preventDefault();
            return false;
          }
        });
        // 定期清理控制台，防止被长时间打开
        setInterval(function () {
          console.clear();
        }, 3000);
      })();

      // ===== 星空背景 =====
      (function () {
        var c = document.getElementById('starfield'),
          ctx = c.getContext('2d'),
          stars = [],
          w,
          h,
          t = 0;
        function resize() {
          w = c.width = window.innerWidth;
          h = c.height = window.innerHeight;
          stars = [];
          for (var i = 0; i < 120; i++)
            stars.push({
              x: Math.random() * w,
              y: Math.random() * h,
              r: Math.random() * 1.5 + 0.3,
              ts: Math.random() * 0.01 + 0.003,
              to: Math.random() * Math.PI * 2,
              o: Math.random() * 0.4 + 0.06,
              hue: Math.random() > 0.7 ? 42 : 0,
            });
        }
        resize();
        window.addEventListener('resize', resize);
        function draw() {
          t++;
          ctx.clearRect(0, 0, w, h);
          stars.forEach(function (s) {
            var a = s.o + Math.sin(t * s.ts + s.to) * 0.15;
            a = Math.max(0.02, Math.min(0.5, a));
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            ctx.fillStyle = s.hue ? 'rgba(184,154,92,' + a + ')' : 'rgba(200,200,215,' + a + ')';
            ctx.fill();
          });
          requestAnimationFrame(draw);
        }
        draw();
      })();

      // ===== 标签切换 =====
      document.querySelector('.tab-bar').addEventListener('click', function (e) {
        var btn = e.target.closest('.tab-btn');
        if (!btn) return;
        document.querySelectorAll('.tab-btn').forEach(function (b) {
          b.classList.remove('active');
        });
        btn.classList.add('active');
        document.querySelectorAll('.tab-panel').forEach(function (p) {
          p.classList.remove('active');
        });
        document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
      });

      // ===== Tab 1: SVG 架构图 =====
      (function () {
        var CX = 650,
          ML = 50,
          WK = 1200; // WK=工作区宽度

        // 辅助：一排均匀分布的矩形
        function row(items, y, w, h, rx, gap, fill, stroke, sw, color, fs) {
          var n = items.length,
            tw = n * w + (n - 1) * gap,
            sx = ML + (WK - tw) / 2,
            s = '';
          for (var i = 0; i < n; i++) {
            var x = sx + i * (w + gap);
            s +=
              '<rect x="' +
              x +
              '" y="' +
              y +
              '" width="' +
              w +
              '" height="' +
              h +
              '" rx="' +
              rx +
              '" fill="' +
              fill +
              '" stroke="' +
              stroke +
              '" stroke-width="' +
              sw +
              '"/>' +
              '<text x="' +
              (x + w / 2) +
              '" y="' +
              (y + h / 2 + 4) +
              '" text-anchor="middle" fill="' +
              color +
              '" font-size="' +
              fs +
              '" font-weight="600">' +
              items[i] +
              '</text>';
          }
          return s;
        }
        // 一排独立颜色的小标签
        function rowColor(items, y, w, h, rx, gap) {
          // items: [{label,fill,stroke,color}]
          var n = items.length,
            tw = n * w + (n - 1) * gap,
            sx = ML + (WK - tw) / 2,
            s = '';
          for (var i = 0; i < n; i++) {
            var it = items[i],
              x = sx + i * (w + gap);
            s +=
              '<rect x="' +
              x +
              '" y="' +
              y +
              '" width="' +
              w +
              '" height="' +
              h +
              '" rx="' +
              rx +
              '" fill="' +
              it.fill +
              '" stroke="' +
              it.stroke +
              '" stroke-width="0.8"/>' +
              '<text x="' +
              (x + w / 2) +
              '" y="' +
              (y + h / 2 + 3) +
              '" text-anchor="middle" fill="' +
              it.color +
              '" font-size="9">' +
              it.label +
              '</text>';
          }
          return s;
        }
        // 箭头：从一排item的中心向下
        function arrowsDown(items, y1, y2, w, gap, strokeColor, sw) {
          var n = items.length,
            tw = n * w + (n - 1) * gap,
            sx = ML + (WK - tw) / 2,
            s = '';
          for (var i = 0; i < n; i++) {
            var x = sx + i * (w + gap) + w / 2;
            s +=
              '<line x1="' +
              x +
              '" y1="' +
              y1 +
              '" x2="' +
              x +
              '" y2="' +
              y2 +
              '" stroke="' +
              strokeColor +
              '" stroke-width="' +
              sw +
              '"/>';
          }
          return s;
        }

            '  → 综合评分：<span style="color:#b89a5c;font-size:1.2em">73</span>/100 | 趋势：<span style="color:#4a8a5c">上升</span>',
            'log-result'
          );
          addLog(
            '  → 建议：<span style="color:#d4bb7c">考公方向发展前景更好，互联网行业竞争激烈但薪资可观</span>',
            'log-result'
          );
          addLog(
            '  → 总耗时：<span style="color:#8a8576">' + elapsed + 'ms</span>（纯前端算法，零API调用）',
            'log-result'
          );
          addLog('<span class="log-time">[' + new Date().toLocaleTimeString() + ']</span> 推演完成 ✓', 'log-info');
          btn.disabled = false;

        }, 3200);
      };
