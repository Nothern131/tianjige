<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>天机阁 · 引擎测试评估</title>
  <style>
    :root {
      --bg: #08070e;
      --surface: rgba(255,255,255,0.028);
      --surface-2: rgba(255,255,255,0.05);
      --border: rgba(184,154,92,0.2);
      --border-soft: rgba(255,255,255,0.055);
      --gold: #b89a5c;
      --gold-bright: #e8d5a3;
      --gold-glow: rgba(184,154,92,0.18);
      --gold-wash: rgba(184,154,92,0.06);
      --text: #e6dcc8;
      --text-2: #a89e8e;
      --text-3: #6a6258;
      --pass: #34d399;
      --pass-glow: rgba(52,211,153,0.15);
      --pass-border: rgba(52,211,153,0.25);
      --fail: #f87171;
      --fail-glow: rgba(248,113,113,0.12);
      --fail-border: rgba(248,113,113,0.22);
      --warn: #fbbf24;
      --r: 8px;
      --r-sm: 5px;
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
      min-height: 100vh;
      font-size: 13px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Top Bar ── */
    .topbar {
      padding: 16px 32px;
      border-bottom: 1px solid var(--border-soft);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      background: rgba(0,0,0,0.2);
    }
    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .topbar-logo {
      width: 36px; height: 36px;
      border-radius: var(--r-sm);
      background: var(--gold-glow);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem;
    }
    .topbar-title h1 {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--gold-bright);
      letter-spacing: 0.08em;
    }
    .topbar-title p {
      font-size: 0.7rem;
      color: var(--text-3);
      letter-spacing: 0.04em;
      margin-top: 1px;
    }
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .topbar-meta {
      text-align: right;
      font-size: 0.68rem;
      color: var(--text-3);
      line-height: 1.7;
    }
    .topbar-meta strong { color: var(--text-2); font-weight: 500; }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 18px;
      border-radius: var(--r);
      border: 1px solid var(--border);
      background: var(--gold-glow);
      color: var(--gold-bright);
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .btn:hover { background: rgba(184,154,92,0.28); border-color: var(--gold); }
    .btn.primary {
      background: var(--gold);
      color: #08070e;
      border-color: var(--gold);
      font-weight: 600;
    }
    .btn.primary:hover { background: #c9a860; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-sm { padding: 5px 12px; font-size: 0.75rem; }

    /* ── Summary Panel ── */
    .summary-panel {
      padding: 20px 32px;
      border-bottom: 1px solid var(--border-soft);
      background: var(--surface);
    }
    .summary-grid {
      display: grid;
      grid-template-columns: 200px 1fr;
      gap: 24px;
      align-items: start;
    }
    .summary-big {
      text-align: center;
      padding: 16px;
      background: var(--bg);
      border: 1px solid var(--border-soft);
      border-radius: var(--r);
    }
    .summary-big .big-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-3);
      margin-bottom: 6px;
    }
    .summary-big .big-score {
      font-size: 3rem;
      font-weight: 700;
      line-height: 1;
      color: var(--gold);
      transition: color 0.3s;
    }
    .summary-big .big-score.perfect { color: var(--pass); }
    .summary-big .big-score.imperfect { color: var(--fail); }
    .summary-big .big-sub {
      font-size: 0.72rem;
      color: var(--text-3);
      margin-top: 6px;
    }
    .summary-bars {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .bar-row {
      display: grid;
      grid-template-columns: 72px 1fr 56px;
      align-items: center;
      gap: 10px;
    }
    .bar-label {
      font-size: 0.75rem;
      color: var(--text-2);
      font-weight: 500;
    }
    .bar-track {
      height: 6px;
      background: var(--surface-2);
      border-radius: 3px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
      width: 0%;
    }
    .bar-fill.perfect { background: var(--pass); }
    .bar-fill.imperfect { background: var(--fail); }
    .bar-fill.partial { background: var(--warn); }
    .bar-stat {
      font-size: 0.7rem;
      color: var(--text-3);
      text-align: right;
      font-family: "SF Mono","Fira Code",monospace;
    }
    .bar-empty { color: var(--text-3); opacity: 0.5; }

    /* ── Engine Cards Row ── */
    .engine-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 8px;
      padding: 16px 32px;
      border-bottom: 1px solid var(--border-soft);
    }
    .eng-card {
      background: var(--surface);
      border: 1px solid var(--border-soft);
      border-radius: var(--r-sm);
      padding: 10px 12px;
      text-align: center;
      transition: border-color 0.15s;
    }
    .eng-card:hover { border-color: var(--border); }
    .eng-card-name {
      font-size: 0.7rem;
      color: var(--text-3);
      margin-bottom: 4px;
      letter-spacing: 0.04em;
    }
    .eng-card-score {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-3);
      line-height: 1;
      transition: color 0.3s;
    }
    .eng-card-score.perfect { color: var(--pass); }
    .eng-card-score.imperfect { color: var(--fail); }
    .eng-card-score.partial { color: var(--warn); }
    .eng-card-stat {
      font-size: 0.62rem;
      color: var(--text-3);
      margin-top: 3px;
      font-family: "SF Mono",monospace;
    }

    /* ── Filter Bar ── */
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 12px 32px;
      border-bottom: 1px solid var(--border-soft);
      flex-wrap: wrap;
    }
    .filter-group {
      display: flex;
      align-items: center;
      gap: 4px;
      padding-right: 12px;
      border-right: 1px solid var(--border-soft);
      margin-right: 4px;
    }
    .filter-group:last-of-type { border-right: none; }
    .filter-label {
      font-size: 0.68rem;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-right: 4px;
      white-space: nowrap;
    }
    .filter-btn {
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-3);
      cursor: pointer;
      font-size: 0.72rem;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .filter-btn:hover { color: var(--text-2); }
    .filter-btn.active {
      background: var(--gold-wash);
      border-color: var(--border);
      color: var(--gold-bright);
    }

    /* ── Table ── */
    .table-wrap {
      padding: 0 32px 32px;
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    thead th {
      padding: 9px 12px;
      text-align: left;
      font-weight: 500;
      color: var(--text-3);
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      border-bottom: 1px solid var(--border-soft);
      white-space: nowrap;
      position: sticky;
      top: 0;
      background: var(--bg);
    }
    thead th.c-id { width: 60px; }
    thead th.c-engine { width: 80px; }
    thead th.c-status { width: 48px; text-align: center; }
    thead th.c-time { width: 56px; text-align: right; }
    thead th.c-input { min-width: 150px; }
    thead th.c-expected { min-width: 180px; }
    thead th.c-action { width: 48px; }

    tbody tr {
      border-bottom: 1px solid var(--border-soft);
      transition: background 0.1s;
    }
    tbody tr:hover { background: var(--surface-2); }
    tbody tr.passed-row { }
    tbody tr.failed-row { background: var(--fail-glow); }
    tbody tr.failed-row:hover { background: rgba(248,113,113,0.18); }
    tbody td { padding: 8px 12px; vertical-align: middle; }

    .cell-id {
      font-weight: 700;
      color: var(--text-3);
      font-family: "SF Mono","Fira Code",monospace;
      font-size: 0.72rem;
    }
    .failed-row .cell-id { color: var(--fail); }

    .badge-eng {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--surface-2);
      border: 1px solid var(--border-soft);
      font-size: 0.68rem;
      color: var(--text-2);
      white-space: nowrap;
    }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .status-dot.pass { background: var(--pass); box-shadow: 0 0 6px var(--pass-glow); }
    .status-dot.fail { background: var(--fail); box-shadow: 0 0 6px var(--fail-glow); }

    .cell-input {
      font-family: "SF Mono","Fira Code",monospace;
      font-size: 0.68rem;
      color: var(--text-3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 180px;
    }
    .cell-expected {
      font-family: "SF Mono","Fira Code",monospace;
      font-size: 0.68rem;
      color: var(--text-2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
    }
    .cell-expected.fail-val { color: var(--fail); }

    .cell-source {
      font-size: 0.68rem;
      color: var(--text-3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 140px;
    }
    .cell-time {
      font-size: 0.68rem;
      color: var(--text-3);
      text-align: right;
      font-family: "SF Mono",monospace;
    }

    .btn-detail {
      background: none; border: none;
      color: var(--text-3); cursor: pointer;
      font-size: 0.65rem; padding: 3px 8px;
      border-radius: 4px;
      transition: all 0.15s;
    }
    .btn-detail:hover { color: var(--gold); background: var(--gold-wash); }

    /* Detail row */
    .detail-row td { padding: 0; background: rgba(0,0,0,0.15); }
    .detail-panel {
      display: none;
      padding: 16px 20px;
      gap: 20px;
    }
    .detail-panel.open { display: grid; grid-template-columns: 1fr 1fr; }
    .detail-block h4 {
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-3);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .detail-block h4::before {
      content: '';
      width: 8px; height: 1px;
      background: var(--text-3);
    }
    .detail-block pre {
      background: rgba(0,0,0,0.35);
      border: 1px solid var(--border-soft);
      border-radius: var(--r-sm);
      padding: 10px 12px;
      font-family: "SF Mono","Fira Code",monospace;
      font-size: 0.68rem;
      color: var(--text-2);
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 220px;
      overflow-y: auto;
      line-height: 1.6;
    }
    .detail-block pre.hl-pass { border-color: var(--pass-border); color: var(--pass); }
    .detail-block pre.hl-fail { border-color: var(--fail-border); color: var(--fail); }
    .detail-error {
      grid-column: 1 / -1;
      padding: 8px 12px;
      background: var(--fail-glow);
      border: 1px solid var(--fail-border);
      border-radius: var(--r-sm);
      font-size: 0.72rem;
      color: var(--fail);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .detail-error::before { content: '⚠'; font-size: 0.85rem; }

    /* ── Empty State ── */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-3);
    }
    .empty-state .icon {
      font-size: 2.8rem;
      margin-bottom: 14px;
      opacity: 0.6;
    }
    .empty-state h3 {
      font-size: 1rem;
      font-weight: 500;
      color: var(--text-2);
      margin-bottom: 6px;
    }
    .empty-state p { font-size: 0.8rem; }

    /* ── Footer ── */
    .footer {
      padding: 14px 32px;
      border-top: 1px solid var(--border-soft);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.68rem;
      color: var(--text-3);
      flex-wrap: wrap;
      gap: 8px;
    }
    .footer a {
      color: var(--text-3);
      text-decoration: none;
      transition: color 0.15s;
    }
    .footer a:hover { color: var(--gold); }

    /* ── Animations ── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .running .icon-spin { animation: spin 0.9s linear infinite; display: inline-block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.25s ease; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
    .pulse { animation: pulse 1.5s ease infinite; }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .topbar { padding: 12px 16px; }
      .summary-panel { padding: 14px 16px; }
      .summary-grid { grid-template-columns: 1fr; }
      .engine-cards { padding: 12px 16px; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); }
      .filter-bar { padding: 10px 16px; }
      .table-wrap { padding: 0 8px 20px; overflow-x: auto; }
      table { min-width: 620px; }
      .detail-panel.open { grid-template-columns: 1fr; }
      .footer { padding: 12px 16px; }
    }
  </style>
</head>
<body>

<!-- Top Bar -->
<div class="topbar">
  <div class="topbar-brand">
    <div class="topbar-logo">☯</div>
    <div class="topbar-title">
      <h1>天机阁 · 引擎测试评估</h1>
      <p>天机阁引擎测试 &nbsp;·&nbsp; 10 大引擎 &nbsp;·&nbsp; 实时验证</p>
    </div>
  </div>
  <div class="topbar-right">
    <div class="topbar-meta">
      <span id="modeLabel">模式: <strong>固定测试</strong></span>
      <span>执行时间 <strong id="execTime">—</strong></span>
      <span>用例总数 <strong id="totalCase">—</strong></span>
    </div>
    <button class="btn" id="modeBtn" onclick="toggleMode()">固定 / 随机</button>
    <button class="btn primary" id="runBtn" onclick="runAll()">
      <span class="icon-spin">▶</span> 运行测试
    </button>
  </div>
</div>

<!-- Summary Panel -->
<div class="summary-panel" id="summaryPanel" style="display:none">
  <div class="summary-grid">
    <div class="summary-big">
      <div class="big-label">综合得分</div>
      <div class="big-score" id="bigScore">—</div>
      <div class="big-sub" id="bigSub">等待运行</div>
    </div>
    <div class="summary-bars" id="summaryBars"></div>
  </div>
</div>

<!-- Engine Cards -->
<div class="engine-cards" id="engineCards"></div>

<!-- Filters -->
<div class="filter-bar">
  <div class="filter-group">
    <span class="filter-label">状态</span>
    <button class="filter-btn active" data-filter="all" onclick="setFilter('all',this)">全部</button>
    <button class="filter-btn" data-filter="pass" onclick="setFilter('pass',this)">通过</button>
    <button class="filter-btn" data-filter="fail" onclick="setFilter('fail',this)">失败</button>
  </div>
  <div class="filter-group">
    <span class="filter-label">引擎</span>
    <button class="filter-btn" data-engine="bazi" onclick="setEngine('bazi',this)">八字</button>
    <button class="filter-btn" data-engine="liuyao" onclick="setEngine('liuyao',this)">六爻</button>
    <button class="filter-btn" data-engine="meihua" onclick="setEngine('meihua',this)">梅花</button>
    <button class="filter-btn" data-engine="constants" onclick="setEngine('constants',this)">常量</button>
    <button class="filter-btn" data-engine="engine-registry" onclick="setEngine('engine-registry',this)">注册</button>
  </div>
</div>

<!-- Table -->
<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th class="c-id">用例</th>
        <th class="c-engine">引擎</th>
        <th class="c-status">状态</th>
        <th class="c-input">输入</th>
        <th class="c-expected">期望输出</th>
        <th>说明</th>
        <th class="c-time">耗时</th>
        <th class="c-action"></th>
      </tr>
    </thead>
    <tbody id="tbody">
      <tr><td colspan="8">
        <div class="empty-state">
          <div class="icon">⚗️</div>
          <h3>准备就绪</h3>
          <p>点击「运行测试」开始验证全部 95 组用例</p>
        </div>
      </td></tr>
    </tbody>
  </table>
</div>

<!-- Footer -->
<div class="footer">
  <span>天机阁 v2.1.0 &nbsp;·&nbsp; 纯前端架构 &nbsp;·&nbsp; 黄金测试集</span>
  <a href="../index.html">← 返回天机阁</a>
</div>

<!-- Scripts: engines first, then test framework -->
<script src="../static/js/constants.js"></script>
<script src="../static/js/bazi-engine.js"></script>
<script src="../static/js/liuyao-engine.js"></script>
<script src="../static/js/meihua-engine.js"></script>
<script src="../static/js/qimen-engine.js"></script>
<script src="../static/js/taiyi-engine.js"></script>
<script src="../static/js/zhuge-engine.js"></script>
<script src="../static/js/zhougong-engine.js"></script>
<script src="../static/js/daliuren-engine.js"></script>
<script src="../static/js/ziwei-engine.js"></script>
<script src="../static/js/fengshui-engine.js"></script>
<script src="../static/js/engine-registry.js"></script>
<script src="test_runner.js"></script>
<script src="test_browser.js"></script>
<script src="random_tests.js"></script>
<script>
(function() {
  'use strict';

  var ENGINE_NAMES = {
    'bazi': '八字', 'liuyao': '六爻', 'meihua': '梅花',
    'constants': '常量', 'engine-registry': '注册',
    'qimen': '奇门', 'taiyi': '太乙', 'zhuge': '诸葛',
    'zhougong': '解梦', 'daliuren': '六壬', 'ziwei': '紫微', 'fengshui': '风水'
  };

  var currentFilter = 'all';
  var currentEngine = 'all';
  var currentResults = null;
  var __testsReady = false;
  var currentMode = 'fixed';  // 'fixed' | 'random'
  var currentSeed = null;

  // ── Load fixed test data ──
  fetch('golden_set.json')
    .then(function(r) { return r.json(); })
    .then(function(data) { window.__GOLDEN_TESTS__ = data; __testsReady = true; init(); })
    .catch(function(e) {
      console.error('加载测试数据失败:', e);
      window.__GOLDEN_TESTS__ = [];
      __testsReady = true;
      init();
    });

  // ── Init ──
  function init() {
    buildEngineCards();
    if (!window.__GOLDEN_TESTS__ || window.__GOLDEN_TESTS__.length === 0) {
      document.getElementById('tbody').innerHTML =
        '<tr><td colspan="8"><div class="empty-state"><div class="icon">⚠️</div><h3>固定测试数据为空</h3><p>golden_set.json 未加载</p></div></td></tr>';
    }
  }

  // ── Build engine card placeholders ──
  function buildEngineCards(tests) {
    var container = document.getElementById('engineCards');
    container.innerHTML = '';
    var groups = {};
    (tests || []).forEach(function(t) {
      if (!groups[t.engine]) groups[t.engine] = [];
      groups[t.engine].push(t);
    });
    Object.keys(groups).sort().forEach(function(eng) {
      var card = document.createElement('div');
      card.className = 'eng-card';
      card.id = 'ec-' + eng.replace(/[^a-zA-Z0-9]/g, '-');
      card.innerHTML =
        '<div class="eng-card-name">' + (ENGINE_NAMES[eng] || eng) + '</div>' +
        '<div class="eng-card-score" id="ecs-' + eng.replace(/[^a-zA-Z0-9]/g, '-') + '"></div>' +
        '<div class="eng-card-stat" id="ecst-' + eng.replace(/[^a-zA-Z0-9]/g, '-') + '"></div>';
      container.appendChild(card);
    });
  }

  // ── Toggle test mode ──
  window.toggleMode = function() {
    currentMode = currentMode === 'fixed' ? 'random' : 'fixed';
    var label = document.getElementById('modeLabel');
    var desc = currentMode === 'fixed' ? '固定测试' : '随机测试';
    label.innerHTML = '模式: <strong>' + desc + '</strong>';
    currentResults = null;
    document.getElementById('summaryPanel').style.display = 'none';
    document.getElementById('tbody').innerHTML =
      '<tr><td colspan="8"><div class="empty-state"><div class="icon">⚗️</div><h3>准备就绪</h3><p>点击「运行测试」开始验证</p></div></td></tr>';
  };

  // ── Run all tests ──
  function runAll() {
    var btn = document.getElementById('runBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="icon-spin">◈</span> 运行中...';

    var startTs = performance.now();

    setTimeout(function() {
      try {
        var res;
        if (currentMode === 'random') {
          if (!window.RandomTestGenerator) {
            throw new Error('RandomTestGenerator 未加载，请检查 random_tests.js');
          }
          currentSeed = Math.floor(Math.random() * 999999);
          res = window.__runRandomTests(currentSeed);
          document.getElementById('totalCase').textContent = res.summary.total + ' (随机)';
        } else {
          res = window.__runTests();
          document.getElementById('totalCase').textContent = res.summary.total;
        }
        var elapsed = (performance.now() - startTs).toFixed(0);
        currentResults = res.results;

        document.getElementById('execTime').textContent = elapsed + 'ms';
        document.getElementById('summaryPanel').style.display = '';

        buildEngineCards(currentResults.map(function(r) {
          return { engine: r.engine };
        }));
        renderSummary(res.summary);
        renderEngineScores(res.results);
        renderTable(res.results);
      } catch(e) {
        console.error(e);
        document.getElementById('tbody').innerHTML =
          '<tr><td colspan="8"><div class="empty-state"><div class="icon">⚠️</div><h3>运行失败</h3><p>' + escapeHtml(e.message) + '</p></div></td></tr>';
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span class="icon-spin">↻</span> 重新运行';
      }
    }, 30);
  }

  // ── Render summary panel ──
  function renderSummary(summary) {
    var score = summary.score || 0;
    var scoreEl = document.getElementById('bigScore');
    scoreEl.textContent = score + '%';
    scoreEl.className = 'big-score ' + (score === 100 ? 'perfect' : score > 50 ? '' : 'imperfect');
    document.getElementById('bigSub').textContent = summary.passed + '/' + summary.total + ' 通过';

    var stats = {};
    (currentResults || []).forEach(function(r) {
      if (!stats[r.engine]) stats[r.engine] = { total: 0, pass: 0 };
      stats[r.engine].total++;
      if (r.passed) stats[r.engine].pass++;
    });

    var barsContainer = document.getElementById('summaryBars');
    barsContainer.innerHTML = '';
    Object.keys(stats).sort().forEach(function(eng) {
      var s = stats[eng];
      var pct = Math.round(s.pass / s.total * 100);
      var cls = pct === 100 ? 'perfect' : pct >= 50 ? 'partial' : 'imperfect';
      var row = document.createElement('div');
      row.className = 'bar-row';
      row.innerHTML =
        '<span class="bar-label">' + (ENGINE_NAMES[eng] || eng) + '</span>' +
        '<div class="bar-track"><div class="bar-fill ' + cls + '" data-w="' + pct + '"></div></div>' +
        '<span class="bar-stat">' + s.pass + '/' + s.total + '</span>';
      barsContainer.appendChild(row);
      requestAnimationFrame(function() {
        requestAnimationFrame(function() {
          var fill = row.querySelector('.bar-fill');
          if (fill) fill.style.width = pct + '%';
        });
      });
    });
  }

  // ── Render engine cards ──
  function renderEngineScores(results) {
    var stats = {};
    results.forEach(function(r) {
      if (!stats[r.engine]) stats[r.engine] = { total: 0, pass: 0 };
      stats[r.engine].total++;
      if (r.passed) stats[r.engine].pass++;
    });
    Object.keys(stats).forEach(function(eng) {
      var s = stats[eng];
      var pct = Math.round(s.pass / s.total * 100);
      var cls = pct === 100 ? 'perfect' : pct >= 50 ? '' : 'imperfect';
      var scoreEl = document.getElementById('ecs-' + eng.replace(/[^a-zA-Z0-9]/g, '-'));
      var statEl = document.getElementById('ecst-' + eng.replace(/[^a-zA-Z0-9]/g, '-'));
      if (scoreEl) { scoreEl.textContent = pct + '%'; scoreEl.className = 'eng-card-score ' + cls; }
      if (statEl) statEl.textContent = s.pass + '/' + s.total;
    });
  }

  // ── Render table ──
  function renderTable(results) {
    var tbody = document.getElementById('tbody');
    tbody.innerHTML = '';

    var filtered = results.filter(function(r) {
      var mf = currentFilter === 'all' ||
        (currentFilter === 'pass' && r.passed) ||
        (currentFilter === 'fail' && !r.passed);
      var me = currentEngine === 'all' || r.engine === currentEngine;
      return mf && me;
    });

    if (filtered.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state"><p>无匹配结果</p></div></td></tr>';
      return;
    }

    filtered.forEach(function(r) {
      var isFail = !r.passed;
      // 随机测试显示"结构校验"，固定测试显示期望值
      var expectedDisplay = (currentMode === 'random' || !r.expected)
        ? '<span style="color:var(--text-3);font-size:0.72rem">结构校验</span>'
        : escapeHtml(JSON.stringify(r.expected).substring(0, 80));
      var rowClass = isFail ? 'failed-row' : 'passed-row';

      var tr = document.createElement('tr');
      tr.className = rowClass + ' fade-in';
      tr.dataset.id = r.id;
      tr.innerHTML =
        '<td><span class="cell-id">' + r.id + '</span></td>' +
        '<td><span class="badge-eng">' + (ENGINE_NAMES[r.engine] || r.engine) + '</span></td>' +
        '<td style="text-align:center"><span class="status-dot ' + (r.passed ? 'pass' : 'fail') + '"></span></td>' +
        '<td><div class="cell-input" title="' + escapeHtml(JSON.stringify(r.input)) + '">' + escapeHtml(JSON.stringify(r.input)) + '</div></td>' +
        '<td><div class="cell-expected' + (isFail ? ' fail-val' : '') + '" title="' + (currentMode === 'random' ? '结构校验' : JSON.stringify(r.expected)) + '">' + expectedDisplay + '</div></td>' +
        '<td><div class="cell-source">' + escapeHtml(r.source || '') + (currentMode === 'random' ? (r.seed ? '  seed:' + r.seed : '') : '') + '</div></td>' +
        '<td class="cell-time">' + r.duration + 'ms</td>' +
        '<td><button class="btn-detail" onclick="toggleDetail(this)">展开</button></td>';
      tbody.appendChild(tr);

      // Detail row
      var detailTr = document.createElement('tr');
      detailTr.className = 'detail-row';
      var actualStr = r.actual ? JSON.stringify(r.actual, null, 2) : 'null';
      var hl = r.passed ? 'hl-pass' : 'hl-fail';
      var errorHtml = r.error ? '<div class="detail-error">' + escapeHtml(r.error) + '</div>' : '';
      var expectedBlock = currentMode === 'random'
        ? '<div class="detail-block"><h4>校验规则</h4><pre class="hl-pass">结构合法性验证（不预设固定答案）</pre></div>'
        : '<div class="detail-block"><h4>期望输出</h4><pre class="' + hl + '">' + escapeHtml(r.expected ? JSON.stringify(r.expected, null, 2) : 'null') + '</pre></div>';
      detailTr.innerHTML =
        '<td colspan="8">' +
          '<div class="detail-panel">' +
            expectedBlock +
            '<div class="detail-block"><h4>实际输出</h4><pre class="' + hl + '">' + escapeHtml(actualStr) + '</pre></div>' +
            errorHtml +
          '</div></td>';
      tbody.appendChild(detailTr);
    });
  }

  // ── Toggle detail ──
  window.toggleDetail = function(btn) {
    var tr = btn.closest('tr');
    var detailTr = tr.nextElementSibling;
    if (!detailTr || !detailTr.classList.contains('detail-row')) return;
    var panel = detailTr.querySelector('.detail-panel');
    var isOpen = panel.classList.contains('open');
    panel.classList.toggle('open');
    btn.textContent = isOpen ? '收起' : '展开';
    tr.classList.toggle('expanded', !isOpen);
  };

  // ── Filters ──
  window.setFilter = function(filter, btn) {
    currentFilter = filter;
    document.querySelectorAll('.filter-btn[data-filter]').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    if (currentResults) renderTable(currentResults);
  };

  window.setEngine = function(engine, btn) {
    if (currentEngine === engine) {
      currentEngine = 'all';
      document.querySelectorAll('.filter-btn[data-engine]').forEach(function(b) { b.classList.remove('active'); });
    } else {
      currentEngine = engine;
      document.querySelectorAll('.filter-btn[data-engine]').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
    }
    if (currentResults) renderTable(currentResults);
  };

  function escapeHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  window.runAll = runAll;
  window.toggleMode = toggleMode;
})();
</script>
</body>
</html>
